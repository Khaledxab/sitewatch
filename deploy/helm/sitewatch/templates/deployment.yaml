apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        checksum/targets: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: sitewatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "-targets", "/etc/sitewatch/targets.txt", "-interval", "{{ .Values.interval }}", "-timeout", "{{ .Values.timeout }}"]
          ports:
            - {name: http, containerPort: 9115}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: targets, mountPath: /etc/sitewatch}
      volumes:
        - name: targets
          configMap: {name: {{ .Release.Name }}-targets}
